[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xi-ee-pose"
version = "0.1.0"
description = "Camera-to-end-effector pose estimation and hand-eye calibration tools."
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.0",
    "numpy==2.5.1",
    "opencv-python==5.0.0.93",
    "pandas==3.0.3",
    "scipy==1.18.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["transform_si"]
